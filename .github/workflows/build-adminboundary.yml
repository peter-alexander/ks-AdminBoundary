name: Build Overture AdminBoundary
on:
  workflow_dispatch:
    inputs:
      overture_release:
        description: Overture release or latest
        required: true
        default: latest
        type: string
      boundary_maxzoom:
        description: Boundary maximum zoom
        required: true
        default: '14'
        type: string
      area_maxzoom:
        description: Area maximum zoom
        required: true
        default: '11'
        type: string
  schedule:
    - cron: '17 4 28 * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: admin-boundary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    env:
      OVERTURE_RELEASE: ${{ inputs.overture_release || 'latest' }}
      BOUNDARY_MAXZOOM: ${{ inputs.boundary_maxzoom || '14' }}
      AREA_MAXZOOM: ${{ inputs.area_maxzoom || '11' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y build-essential libsqlite3-dev zlib1g-dev
      - name: Restore tippecanoe
        id: tippecanoe-cache
        uses: actions/cache@v4
        with:
          path: .local/bin
          key: ${{ runner.os }}-tippecanoe-${{ hashFiles('.github/scripts/build-tippecanoe.sh') }}
      - name: Build tippecanoe
        if: steps.tippecanoe-cache.outputs.cache-hit != 'true'
        run: bash .github/scripts/build-tippecanoe.sh
      - name: Build both PMTiles
        env:
          TIPPECANOE_BIN: ${{ github.workspace }}/.local/bin/tippecanoe
        run: |
          set -euo pipefail
          /usr/bin/time -v python build.py \
            --release "$OVERTURE_RELEASE" \
            --boundary-maxzoom "$BOUNDARY_MAXZOOM" \
            --area-maxzoom "$AREA_MAXZOOM" \
            --tippecanoe "$TIPPECANOE_BIN"
          test -s build/OvertureAdmin/overture-admin-area.pmtiles
          test -s build/OvertureAdmin/overture-admin-boundary.pmtiles
          du -h build/OvertureAdmin/*
      - name: Store build metadata
        uses: actions/upload-artifact@v4
        with:
          name: adminboundary-metadata
          path: |
            build/OvertureAdmin/release.json
            build/OvertureAdmin/audit.json
          retention-days: 30
      - name: Validate R2 configuration
        if: github.ref == 'refs/heads/main'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          : "${R2_ACCOUNT_ID:?Missing R2_ACCOUNT_ID secret}"
          : "${R2_BUCKET:?Missing R2_BUCKET secret}"
          : "${AWS_ACCESS_KEY_ID:?Missing R2_ACCESS_KEY_ID secret}"
          : "${AWS_SECRET_ACCESS_KEY:?Missing R2_SECRET_ACCESS_KEY secret}"
      - name: Upload boundary PMTiles to R2
        if: github.ref == 'refs/heads/main'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          set -euo pipefail
          FILE=build/OvertureAdmin/overture-admin-boundary.pmtiles
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp "$FILE" "s3://${R2_BUCKET}/overture-admin-boundary.pmtiles" \
            --endpoint-url "$ENDPOINT" --no-progress \
            --content-type application/octet-stream
          REMOTE_SIZE="$(aws s3api head-object \
            --bucket "$R2_BUCKET" \
            --key overture-admin-boundary.pmtiles \
            --endpoint-url "$ENDPOINT" --query ContentLength --output text)"
          LOCAL_SIZE="$(stat -c %s "$FILE")"
          test "$REMOTE_SIZE" = "$LOCAL_SIZE"
      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Prepare Pages files
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          mkdir -p pages
          cp build/OvertureAdmin/overture-admin-area.pmtiles pages/
          touch pages/.nojekyll
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - name: Deploy GitHub Pages
        if: github.ref == 'refs/heads/main'
        id: pages
        uses: actions/deploy-pages@v4
