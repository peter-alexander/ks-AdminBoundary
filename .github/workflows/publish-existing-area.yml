name: Publish existing area PMTiles to Pages
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: adminboundary-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download existing area PMTiles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p pages
          gh release download adminboundary-40388541218-1 \
            --repo peter-alexander/ks-AdminBoundary \
            --pattern overture-admin-area.pmtiles \
            --dir pages
          test -s pages/overture-admin-area.pmtiles
          printf '\n' > pages/.nojekyll
          du -h pages/overture-admin-area.pmtiles
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
